[package]
name = "proof-xmr"
version = "0.1.0"
edition = "2021"

[dependencies]
bulletproofs = { version = "5", features = ["yoloproofs"] }
curve25519-dalek = { version = "4", features = ["rand_core", "digest"] }
merlin = "3"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
hex = "0.4"

[profile.release]
opt-level = 3

[patch.crates-io]
bulletproofs = { path = "../vendor/bulletproofs" }
