[package]
name = "proof-zec"
version = "0.1.0"
edition = "2021"

[dependencies]
bp-pallas = { path = "../vendor/bp-pallas" }
pasta_curves = "0.5"
group = "0.13"
ff = "0.13"
reddsa = { version = "0.5", features = ["std"] }
orchard = { version = "0.15.5", default-features = false }
