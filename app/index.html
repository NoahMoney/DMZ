<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* wss: http://127.0.0.1:* http://localhost:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="veil-commit" content="14">
<title>DMZ</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div class="brand" id="brand"><svg class="mark" viewBox="0 0 154 40" role="img" aria-label="DMZ"><path fill="var(--fg)" fill-rule="evenodd" d="M0 6 6 0h18l10 10v20l-10 10H6L0 34Z M10 11h10l4 4v10l-4 4H10Z"/><path fill="var(--fg)" d="M44 40V6l6-6h6l14 24L84 0h6l6 6v34h-10V16L74 37h-8L54 16v24Z"/><path fill="var(--acc)" d="M57 40h11L84 0H73Z"/><path fill="var(--fg)" d="M104 0h50v10l-32 20h32v10h-50v-10l32-20h-32Z"/><path fill="var(--graphite)" d="M136 10h18l-32 20h-18Z"/></svg></div>
    <div class="gsearch"><input id="gsearch" type="search" placeholder="Search markets, tickers, contract ids" autocomplete="off" spellcheck="false" aria-label="search"></div>
    <div class="top-right">
      <span id="net" class="pill dim">offline</span>
      <button id="walletBtn" class="btn small primary" type="button">Connect</button>
    </div>
  </header>
  <div id="tape" class="tape" hidden></div>
  <div id="netwarn" class="errbox netwarn" role="alert" hidden></div>
  <div id="stale" class="warnbox netwarn" role="status" hidden></div>

  <main id="screen" class="screen"></main>

  <nav class="tabs" role="tablist" aria-label="Main">
    <div class="side-brand"><svg class="mark" viewBox="0 0 154 40" role="img" aria-label="DMZ"><path fill="var(--fg)" fill-rule="evenodd" d="M0 6 6 0h18l10 10v20l-10 10H6L0 34Z M10 11h10l4 4v10l-4 4H10Z"/><path fill="var(--fg)" d="M44 40V6l6-6h6l14 24L84 0h6l6 6v34h-10V16L74 37h-8L54 16v24Z"/><path fill="var(--acc)" d="M57 40h11L84 0H73Z"/><path fill="var(--fg)" d="M104 0h50v10l-32 20h32v10h-50v-10l32-20h-32Z"/><path fill="var(--graphite)" d="M136 10h18l-32 20h-18Z"/></svg></div>
    <button class="tab" data-tab="home" role="tab" type="button"><i class="ic ic-home"></i><span>Home</span></button>
    <button class="tab" data-tab="markets" role="tab" type="button"><i class="ic ic-markets"></i><span>Markets</span></button>
    <button class="tab tab-main" data-tab="trade" role="tab" type="button"><i class="ic ic-trade"></i><span>Trade</span></button>
    <button class="tab" data-tab="wrap" role="tab" type="button"><i class="ic ic-wrap"></i><span>Wrap</span></button>
    <button class="tab" data-tab="zswap" role="tab" type="button"><i class="ic ic-trade"></i><span>ZEC swap</span></button>
    <button class="tab" data-tab="xmr" role="tab" type="button"><i class="ic ic-trade"></i><span>XMR swap</span></button>
    <button class="tab" data-tab="nfts" role="tab" type="button"><i class="ic ic-nft"></i><span>NFTs</span></button>
    <button class="tab" data-tab="chat" role="tab" type="button"><i class="ic ic-chat"></i><span>Chat</span></button>
    <button class="tab" data-tab="portfolio" role="tab" type="button"><i class="ic ic-port"></i><span>Portfolio</span></button>
    <button class="tab" data-tab="profile" role="tab" type="button"><i class="ic ic-user"></i><span>Profile</span></button>
    <div class="side-foot"><div id="sideWallet"></div><div class="note" id="sideNote"></div></div>
  </nav>

  <div id="sheetBackdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
</div>

<script src="config.js"></script>
<script src="rpc.js"></script>
<script src="xswd.js"></script>
<script src="amm.js"></script>
<script src="stats.js"></script>
<script src="ui.js"></script>
<script src="live.js"></script>
<script src="chart.js"></script>
<script src="feed.js"></script>
<script src="names.js"></script>
<script src="founders.js"></script>
<script src="sheets.js"></script>
<script src="forms.js"></script>
<script src="home.js"></script>
<script src="markets.js"></script>
<script src="screens.js"></script>
<script src="token.js"></script>
<script src="nft.js"></script>
<script src="nfts.js"></script>
<script src="nfas.js"></script>
<script src="vault.js"></script>
<script src="wrapui.js"></script>
<script src="wrap.js"></script>
<script src="notice.js"></script>
<script src="chat.js"></script>
<script src="track.js"></script>
<script src="zswap.js"></script>
<script src="xmr.js"></script>
<script src="app.js"></script>
</body>
</html>
