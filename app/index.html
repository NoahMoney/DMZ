<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* wss: http://127.0.0.1:* http://localhost:*; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="veil-commit" content="14">
<title>DMZ</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="parts.css">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div id="glow" aria-hidden="true"></div>
<div id="app" class="app">
  <header class="top">
    <div class="brand" id="brand"><span class="logo" aria-hidden="true"></span>DMZ</div>
    <div class="gsearch"><input id="gsearch" type="search" placeholder="Search markets, tickers, contract ids" autocomplete="off" spellcheck="false" aria-label="search"></div>
    <div class="top-right">
      <span id="net" class="pill dim">offline</span>
      <button id="walletBtn" class="btn small primary" type="button">Connect</button>
    </div>
  </header>
  <div id="tape" class="tape" hidden></div>

  <main id="screen" class="screen"></main>

  <nav class="tabs" role="tablist" aria-label="Main">
    <div class="side-brand" aria-hidden="true"><span class="logo"></span>DMZ</div>
    <button class="tab" data-tab="home" role="tab" type="button"><i class="ic ic-home"></i><span>Home</span></button>
    <button class="tab" data-tab="markets" role="tab" type="button"><i class="ic ic-markets"></i><span>Markets</span></button>
    <button class="tab tab-main" data-tab="trade" role="tab" type="button"><i class="ic ic-trade"></i><span>Trade</span></button>
    <button class="tab" data-tab="nfts" role="tab" type="button"><i class="ic ic-nft"></i><span>NFTs</span></button>
    <button class="tab" data-tab="portfolio" role="tab" type="button"><i class="ic ic-port"></i><span>Portfolio</span></button>
    <button class="tab" data-tab="profile" role="tab" type="button"><i class="ic ic-user"></i><span>Profile</span></button>
    <div class="side-foot"><div id="sideWallet"></div><div class="note" id="sideNote"></div></div>
  </nav>

  <div id="sheetBackdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
</div>

<script src="config.js"></script>
<script src="rpc.js"></script>
<script src="xswd.js"></script>
<script src="amm.js"></script>
<script src="stats.js"></script>
<script src="ui.js"></script>
<script src="live.js"></script>
<script src="chart.js"></script>
<script src="feed.js"></script>
<script src="founders.js"></script>
<script src="sheets.js"></script>
<script src="forms.js"></script>
<script src="home.js"></script>
<script src="markets.js"></script>
<script src="screens.js"></script>
<script src="token.js"></script>
<script src="nft.js"></script>
<script src="nfts.js"></script>
<script src="wrap.js"></script>
<script src="app.js"></script>
</body>
</html>
